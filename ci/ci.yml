name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Evidence (ruff, tests, coverage, SAST, SCA)
        if: always()
        run: |
          python scripts/evidence.py record \
            --out evidence/backend.json \
            --workflow backend \
            --commit "$GITHUB_SHA" \
            --coverage-xml coverage.xml \
            --min-coverage 70 \
            --check "ruff=ruff check ." \
            --check "tests=pytest -q --cov=app --cov-report=xml --cov-fail-under=70" \
            --check "eval=python scripts/run_eval.py" \
            --advisory "bandit=bandit -r app -q -ll" \
            --advisory "pip-audit=pip-audit"
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: api/evidence/backend.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PYTHONPATH: ../api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Evidence (build, unit tests, audit)
        if: always()
        run: |
          python ../scripts/evidence.py record \
            --out evidence/frontend.json \
            --workflow frontend \
            --commit "$GITHUB_SHA" \
            --cwd . \
            --check "build=npm run build" \
            --check "tests=npm test" \
            --advisory "npm-audit=npm audit --audit-level=high"
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-frontend
          path: frontend/evidence/frontend.json
          if-no-files-found: error


  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint chart
        run: helm lint helm/aiwf
      - name: Render chart
        run: helm template aiwf helm/aiwf --namespace aiwf > /tmp/aiwf-rendered.yaml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up -d --build postgres redis opa backend frontend
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:5173 >/dev/null
      - name: Smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color > e2e-compose.log
      - name: Upload logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-compose.log
            frontend/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v
  gate:
    needs: [backend, frontend, helm, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          merge-multiple: true
      - name: Verify evidence
        env:
          PYTHONPATH: api
        run: python api/scripts/evidence.py verify evidence/backend.json evidence/frontend.json --commit "$GITHUB_SHA"