name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Evidence (ruff, tests, coverage, SAST, SCA)
        if: always()
        run: |
          python scripts/evidence.py record \
            --out evidence/backend.json \
            --workflow backend \
            --commit "$GITHUB_SHA" \
            --coverage-xml coverage.xml \
            --min-coverage 55 \
            --check "ruff=ruff check ." \
            --check "tests=pytest -q --cov=app --cov-report=xml --cov-fail-under=55" \
            --advisory "bandit=bandit -r app -q -ll" \
            --advisory "pip-audit=pip-audit"
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend
          path: api/evidence/backend.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PYTHONPATH: ../api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Evidence (build, unit tests, audit)
        if: always()
        run: |
          python ../scripts/evidence.py record \
            --out evidence/frontend.json \
            --workflow frontend \
            --commit "$GITHUB_SHA" \
            --cwd . \
            --check "build=npm run build" \
            --check "tests=npm test" \
            --advisory "npm-audit=npm audit --audit-level=high"
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-frontend
          path: frontend/evidence/frontend.json
          if-no-files-found: error

  gate:
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: evidence
          merge-multiple: true
      - name: Verify evidence
        env:
          PYTHONPATH: api
        run: python api/scripts/evidence.py verify evidence/backend.json evidence/frontend.json --commit "$GITHUB_SHA"