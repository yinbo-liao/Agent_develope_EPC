nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 2
  image:
    repository: aiwf/backend
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    ENVIRONMENT: production
    ENABLE_METRICS: "true"
    ENABLE_TRACING: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    OPA_URL: "http://opa:8181"
    SEED_DEMO_USERS: "false"
    WORKER_ENABLED: "true"
    JOB_MAX_ATTEMPTS: "3"
    CORS_ORIGINS: '["https://aiwf.example.com"]'
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 2
  image:
    repository: aiwf/frontend
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

secrets:
  create: false
  existingSecret: aiwf-secrets
  secretKey: ""
  databaseUrl: ""
  redisUrl: ""
  metricsToken: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: aiwf.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600

serviceAccount:
  create: true
  annotations: {}
  name: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false