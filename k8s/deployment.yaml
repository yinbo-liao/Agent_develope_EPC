apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: fpso-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fpso-backend
  template:
    metadata:
      labels:
        app: fpso-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-org/fpso-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: FPSO_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        - name: FPSO_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { cpu: 1000m, memory: 1Gi }
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: fpso-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: fpso-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fpso-frontend
  template:
    metadata:
      labels:
        app: fpso-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/your-org/fpso-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: fpso-frontend
  ports:
  - port: 80
    targetPort: 80
